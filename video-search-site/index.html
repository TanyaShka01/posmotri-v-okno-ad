<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>По-смотри в окно</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@400;500;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div class="page">
    <div class="main-container">
      <div class="video-section">
        <div class="video-player">
          <video class="video-player__video" controls poster="photo/p3.png" src="https://commondatastorage.googleapis.com/gtv-videos-library/sample/BigBuckBunny.mp4"></video>
          <div class="error-state" style="display: none;">
            <p class="error-state__text">НЕТ ПОДХОДЯЩЕГО ВИДЕО =(</p>
          </div>
        </div>

        <div class="controls">
          <form class="search-form" name="searchForm">
            <fieldset class="search-form__fieldset">
              <legend class="search-form__legend">Параметры поиска</legend>

              <div class="search-form__group search-form__group--city">
                <label class="search-form__label" for="city-input">Город</label>
                <input
                  id="city-input"
                  type="text"
                  class="search-form__textfield"
                  name="searchQuery"
                  placeholder="Санкт-Петербург, например"
                >
              </div>

              <div class="search-form__group search-form__group--time">
                <span class="search-form__label">Время суток</span>
                <div class="search-form__checkboxes">
                  <label class="search-form__checkbox-label">
                    <input type="checkbox" class="search-form__checkbox visually-hidden" name="time-morning">
                    <span class="search-form__checkbox-text">Утро</span>
                  </label>
                  <label class="search-form__checkbox-label">
                    <input type="checkbox" class="search-form__checkbox visually-hidden" name="time-day">
                    <span class="search-form__checkbox-text">День</span>
                  </label>
                  <label class="search-form__checkbox-label">
                    <input type="checkbox" class="search-form__checkbox visually-hidden" name="time-night">
                    <span class="search-form__checkbox-text">Ночь</span>
                  </label>
                </div>
              </div>

              <button type="submit" class="button search-form__button">Найти</button>
            </fieldset>
          </form>
        </div>
      </div>

      <div class="right-section">
        <div class="title-section">
          <h1 class="main-title">
            <span class="main-title__prefix">ПО-</span>
            <span class="main-title__text">СМОТРИ<br>В ОКНО</span>
          </h1>
        </div>

        <div class="cities-container">
          
          <div class="city-card">
            <div class="city-card__info">
              <h2 class="city-card__title">БЕЛГОРОД</h2>
              <p class="city-card__subtitle">ночной Белгород</p>
            </div>
            <img class="city-card__image" src="photo/p1.png" alt="Белгород">
          </div>

          <div class="city-card">
            <div class="city-card__info">
              <h2 class="city-card__title">АДЛЕР</h2>
              <p class="city-card__subtitle">Адлер утром</p>
            </div>
            <img class="city-card__image" src="photo/p2.png" alt="Адлер">
          </div>

          <div class="city-card">
            <div class="city-card__info">
              <h2 class="city-card__title">ВОРОНЕЖ</h2>
              <p class="city-card__subtitle">Воронеж днём</p>
            </div>
            <img class="city-card__image" src="photo/p3.png" alt="Воронеж">
          </div>

          <div class="city-card">
            <div class="city-card__info">
              <h2 class="city-card__title">ЗЕЛЕНОГРАД</h2>
              <p class="city-card__subtitle">Дневной Зеленоград</p>
            </div>
            <img class="city-card__image" src="photo/p4.png" alt="Зеленоград">
          </div>

          <div class="show-more-section">
            <button type="button" class="button button--secondary show-more-button">Показать ещё</button>
          </div>

        </div>
      </div>

    </div>
  </div>

  <script src="scripts/script.js"></script>
</body>
</html>
